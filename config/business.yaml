# Business-level settings. Owner approval needed to loosen anything here.
business:
  name: Prop Firm Manager
  currency: USD
  halted: false               # Orchestrator sets true when a stop-loss rule is hit
  start_date: 2026-11-01

reserve:
  total_usd: 250              # account-purchase reserve only; servers/tools paid separately
  max_live_challenges_before_first_payout: 2

stop_loss:                    # any one true → stop purchase requests, notify owner
  max_breached_attempts: 2
  max_spend_without_funded_usd: 230
  strategy_search_deadline: 2027-02-28   # no strategy passes all gates by then → stop
  max_redesigns_per_hypothesis: 3

research:
  instrument: XAUUSD
  timezone_ist: Asia/Kolkata
  data_start: 2019-01-01
  holdout_months: 12          # last 12 months of available data are sealed for Validation
  max_trials_per_hypothesis: 50
  max_params_per_strategy: 4
  costs:
    spread_points_default: 25       # 0.25 USD/oz if point = 0.01
    slippage_points: 30             # 0.30 USD/oz per side assumed
    commission_per_lot_usd: 0

gates:
  backtested:   {min_trades: 200, min_pf: 1.3, max_dd_pct: 6.0, worst_year_pct: -5.0}
  walkforward:  {min_oos_pf: 1.2, max_oos_dd_ratio: 1.5}
  holdout:      {min_pf: 1.1, max_dd_ratio: 1.5, min_deflated_sharpe: 0.0}
  propsim:      {min_pass_rate: 0.30, max_breach_rate: 0.40, runs: 500}
  demo:         {min_days: 10, max_breaches: 0, trade_rate_tolerance: 0.30, max_slippage_ratio: 1.5}

reinvestment:                 # applied to each confirmed payout
  first_payout: {return_seed_usd: 250, tax_reserve_pct: 30}
  after: {new_challenges_pct: 40, reserve_pct: 30, owner_pct: 30}
  reserve_floor_challenge_fees: 2
  max_share_one_firm_pct: 50
