# v1.1: range filter rescaled. The 05:30-12:30 IST range is typically 1.8-3.9x H1 ATR (2019-2025 data).
default: {rr: 2.0, stop_atr: 1.2, min_range_atr: 1.5, max_range_atr: 4.0}
ranges:
  rr: [1.5, 2.0, 2.5]
  stop_atr: [0.8, 1.2, 1.6]
  min_range_atr: [1.0, 1.5, 2.0]
  max_range_atr: [3.0, 4.0, 5.0]
fixed:
  range_start_ist: "05:30"
  range_end_ist: "12:30"
  entry_start_ist: "13:30"
  entry_end_ist: "16:30"
  timeframe: M15
