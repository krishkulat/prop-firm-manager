# H-003 v1.0. 3 tunable parameters, defaults from the hypothesis, 0 trials used.
default: {west_drop_atr: 0.5, stop_atr: 2.0, exit_utc: "07:30"}
ranges:
  west_drop_atr: [0.0, 0.5, 1.0, 1.5]
  stop_atr: [1.0, 2.0, 3.0]
  exit_utc: ["07:30", "09:00"]
fixed:
  entry_utc: "01:00"           # SGE day-session open (09:00 Beijing), not tuned
  west_window_utc: ["13:30", "21:00"]   # previous trading day
  direction: long_only
  target: none                 # time exit only (or stop)
  timeframe: M15
# Benchmark switches for the H-003 kill criteria — NOT tunable, research only (not in the EA):
benchmark:
  benchmark: [none, no_filter, random_hour]   # default none
  benchmark_seed: 0                           # random_hour only; fixed seed for reproducibility
  # random_hour draws whole UTC hours from 01:00 whose entry + hold ends by 17:00 UTC (22:30 IST): 01-10 at 07:30 exit, 01-09 at 09:00 (R-024)
# SGE holidays: research/calendars/sge_holidays.csv is skipped (R-024); a missing file raises. Covers 2021 on only,
# so 2019-2020 run unfiltered. Risk profile: runs need the5ers_hs50k_10d_c (R-023, entries from 06:00 IST);
# the live profile's 13:30-21:00 IST window still blocks every C entry (Q-002).
