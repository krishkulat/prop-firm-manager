# H-006 v1.0. 3 tunable parameters, defaults from the hypothesis, 0 trials used.
default: {asia_rise_atr: 0.5, stop_atr: 2.0, exit_et: "11:00"}
ranges:                        # 40 combinations; with the 4 first runs that is 44 of the 50-trial cap
  asia_rise_atr: [0.0, 0.5, 1.0, 1.5]
  stop_atr: [1.0, 1.5, 2.0, 2.5, 3.0]
  exit_et: ["10:00", "11:00"]
fixed:
  rise_window_utc: ["01:00", "08:00"]   # 01:00 bar open to 08:00 bar open
  entry_utc: "08:00"           # 13:30 IST all year, the first bar the risk window allows, not tuned
  side: short
  target: none                 # time exit only (or stop)
  timeframe: M15
# Benchmark switches for the H-006 kill criteria - NOT tunable, research only (not in the EA):
benchmark:
  benchmark: [none, random_side, opposite_side, no_filter]   # default none; no_filter is every day, not asia_rise_atr 0
  benchmark_seed: 0                                          # random_side only; fixed seed for reproducibility
# Known gap (H-006 "known problem"): research/news/usd_high_impact.csv holds FOMC, NFP and CPI only. The EA flattens for
# every USD high-importance event in MT5. Check against the full MT5 list before demo.
